name: Build Tafelhelden for macOS

on:
  push:
    tags:
      - 'macos-v*'

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-15
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
      - name: Build the macOS app and disk image
        run: ./macos/build-dmg.sh "${GITHUB_REF_NAME#macos-v}"
      - name: Publish a GitHub release with the DMG
        uses: softprops/action-gh-release@v2
        with:
          name: Tafelhelden voor Mac ${{ github.ref_name }}
          generate_release_notes: true
          files: dist-download/Tafelhelden-macOS.dmg
